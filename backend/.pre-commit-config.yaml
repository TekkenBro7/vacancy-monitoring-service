repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: uv run black
        language: system
        types: [python]
        exclude: ^src/database/alembic/versions/

      - id: isort
        name: isort
        entry: uv run isort
        language: system
        types: [python]
        exclude: ^src/database/alembic/versions/

      - id: ruff
        name: ruff
        entry: uv run ruff check
        language: system
        types: [python]
        exclude: ^src/database/alembic/versions/


      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]

      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
