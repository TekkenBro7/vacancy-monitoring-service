services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vacancy_backend
    env_file:
      - backend/.env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16
    container_name: vacancy_db
    env_file:
      - backend/.env
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 5
      start_period: 5s
  
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vacancy_frontend
    ports:
    - "3000:3000"
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    restart: unless-stopped


volumes:
  db_data:
