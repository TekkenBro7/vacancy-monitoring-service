[project]
name = "vacancy-monitoring-service"
version = "0.1.0"
description = "Vacancy monitoring service"
readme = "README.md"
packages = [
    { include = "src" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.17.2",
    "asyncpg>=0.31.0",
    "fastapi>=0.122.0",
    "httpx>=0.28.1",
    "passlib>=1.7.4",
    "psycopg2-binary>=2.9.11",
    "pytest-asyncio>=1.3.0",
    "sqlalchemy[asyncio]>=2.0.44",
    "uvicorn[standard]>=0.38.0",
]

[dependency-groups]
dev = [
    "black>=25.11.0",
    "faker>=38.2.0",
    "isort>=7.0.0",
    "mypy>=1.18.2",
    "pre-commit>=4.5.0",
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.6",
]

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'
exclude = '''
/(
    migrations/       
  | __pycache__
  | \.git
  | \.pytest_cache
  | \.mypy_cache
  | node_modules
  | build
  | lib
  | \.idea
  | \.vscode
  | \.ruff_cache
  | \.venv
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip = [
    "migrations/",
    "__pycache__",
    ".git",
    ".pytest_cache",
    ".mypy_cache",
    "node_modules",
    "build",
    "lib",
    ".idea",
    ".vscode",
    ".ruff_cache",
    ".venv"
]

[tool.ruff]
line-length = 100

exclude = [
    "migrations",
    "__pycache__",
    ".git",
    ".pytest_cache",
    ".mypy_cache",
    "node_modules",
    "build",
    "lib",
    ".idea",
    ".vscode",
    ".ruff_cache",
    ".venv",
    "src/database/alembic/versions"
]

[tool.ruff.lint]
select = ["E", "F", "W", "UP", "B"]
ignore = ["E501", "F821"]
